services:
  # 1. PostgreSQL Database (Pengganti Supabase)
  db:
    image: postgres:16-alpine
    container_name: pyt-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-planyourtrail_dev}
    volumes:
      - pyt-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planyourtrail_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. MinIO S3 Object Storage (Chainguard verified public image)
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: pyt-minio
    restart: unless-stopped
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # Web Console dashboard
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - pyt-minio-data:/data

  # 3. Web Application (Next.js Standalone Runner)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pyt-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgres://postgres:password@db:5432/planyourtrail_dev
      - BETTER_AUTH_SECRET=simulasi_vps_secret_32_characters_panjang_sekali_123456
      - BETTER_AUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - CRON_SECRET=${CRON_SECRET:-test_cron_secret_lokal_12345}
      # MinIO Configuration
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_URL=http://localhost:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadminpassword
      - S3_BUCKET_NAME=planyourtrail
      - S3_REGION=us-east-1
      - S3_FORCE_PATH_STYLE=true
      # Invoice Admin
      - INVOICE_ADMIN_USER=admin
      - INVOICE_ADMIN_PASSWORD=admin
      # Logging & Error Tracking
      - LOG_LEVEL=info
      - GLITCHTIP_DSN=http://d94f51b0653a4675b9c43e9d3d59ba49@glitchtip:8000/1
      - NEXT_PUBLIC_GLITCHTIP_DSN=http://d94f51b0653a4675b9c43e9d3d59ba49@127.0.0.1:8000/1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 4. GlitchTip Error Tracking (Self-hosted Sentry alternative, internal port)
  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: pyt-glitchtip
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${GLITCHTIP_DATABASE_URL:-postgres://postgres:password@db:5432/glitchtip}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-glitchtip_secret_key_32_characters_123456}
      GLITCHTIP_DOMAIN: "http://127.0.0.1:8000"
      DEFAULT_FROM_EMAIL: ${EMAIL_FROM:-no-reply@planyourtrail.run}
      CELERY_WORKER_CONCURRENCY: 1
      REDIS_URL: ""
      VALKEY_URL: ""
      CACHE_URL: "locmem://"
    depends_on:
      db:
        condition: service_healthy

  # 5. Scheduled Cron Runner (Keep-alive, Quota-monitor & Daily Analytics)
  cron:
    image: alpine:latest
    container_name: pyt-cron
    restart: unless-stopped
    environment:
      - CRON_SECRET=${CRON_SECRET:-test_cron_secret_lokal_12345}
      - WEB_URL=http://web:3000
    volumes:
      - ./scripts/docker-cron.sh:/scripts/docker-cron.sh:ro
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /scripts/docker-cron.sh > /tmp/runner.sh && chmod +x /tmp/runner.sh && exec /tmp/runner.sh"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  pyt-postgres-data:
  pyt-minio-data:
